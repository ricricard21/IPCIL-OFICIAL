<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validar certificado | IPCI</title>
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --text: #eaf0ff;
      --muted: #a9b4d0;
      --ok: #16a34a;
      --bad: #dc2626;
      --accent: #2563eb;
      --border: rgba(255,255,255,.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0a1020 0%, #111a2e 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: rgba(18, 26, 43, 0.95);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      overflow: hidden;
    }

    .header {
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.1;
    }

    .content {
      padding: 28px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      border-radius: 999px;
      padding: 12px 18px;
      margin-bottom: 22px;
      font-size: 16px;
    }

    .status.ok {
      background: rgba(22,163,74,.12);
      color: #86efac;
      border: 1px solid rgba(22,163,74,.25);
    }

    .status.bad {
      background: rgba(220,38,38,.12);
      color: #fca5a5;
      border: 1px solid rgba(220,38,38,.25);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .field {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .value {
      font-size: 18px;
      font-weight: 600;
      word-break: break-word;
    }

    .helper {
      color: var(--muted);
      margin-top: 18px;
      line-height: 1.6;
      font-size: 14px;
    }

    .loading {
      color: var(--muted);
      font-size: 16px;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding: 18px 28px 24px;
      color: var(--muted);
      font-size: 13px;
    }

    a.home {
      color: #93c5fd;
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      h1 { font-size: 25px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="header">
      <div class="brand">IPCI · Validación institucional</div>
      <h1>Verificación de certificado</h1>
    </div>

    <div class="content" id="app">
      <div class="loading">Consultando folio...</div>
    </div>

    <div class="footer">
      Instituto Profesional de Certificación Industrial Latinoamericano ·
      <a class="home" href="/">Volver al inicio</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://wiyvazqleeitvhazfebs.supabase.co";
    const SUPABASE_ANON_KEY = "PEGA_AQUI_TU_PUBLISHABLE_KEY_COMPLETA";

    const app = document.getElementById("app");
    const params = new URLSearchParams(window.location.search);
    const folio = params.get("folio");

    function renderError(title, detail) {
      app.innerHTML = `
        <div class="status bad">✕ ${title}</div>
        <div class="helper">${detail}</div>
      `;
    }

    function renderOk(data) {
      app.innerHTML = `
        <div class="status ok">✓ Certificado válido</div>

        <div class="grid">
          <div class="field">
            <div class="label">Folio</div>
            <div class="value">${data.folio ?? "-"}</div>
          </div>

          <div class="field">
            <div class="label">Estado</div>
            <div class="value">${data.estado ?? "-"}</div>
          </div>

          <div class="field full">
            <div class="label">Nombre</div>
            <div class="value">${data.nombre ?? "-"}</div>
          </div>

          <div class="field full">
            <div class="label">Curso</div>
            <div class="value">${data.curso ?? "-"}</div>
          </div>

          <div class="field">
            <div class="label">Fecha de emisión</div>
            <div class="value">${data.fecha_emision ?? "-"}</div>
          </div>

          <div class="field">
            <div class="label">Modalidad</div>
            <div class="value">${data.modalidad ?? "-"}</div>
          </div>

          <div class="field">
            <div class="label">Duración</div>
            <div class="value">${data.duracion ?? "-"}</div>
          </div>

          <div class="field">
            <div class="label">Instructor</div>
            <div class="value">${data.instructor ?? "-"}</div>
          </div>
        </div>

        <div class="helper">
          Este resultado corresponde al registro oficial consultado mediante folio institucional.
        </div>
      `;
    }

    async function validar() {
      if (!folio) {
        renderError("Folio no proporcionado", "La URL debe incluir un parámetro como ?folio=IPCI-IMDC-2026-0077");
        return;
      }

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/rpc/validar_certificado`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY,
              "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({ p_folio: folio })
          }
        );

        if (!response.ok) {
          const text = await response.text();
          console.error(text);
          renderError("No se pudo validar", "Ocurrió un problema al consultar el folio.");
          return;
        }

        const result = await response.json();

        if (!Array.isArray(result) || result.length === 0) {
          renderError("Folio no encontrado", "No existe un certificado registrado con ese folio.");
          return;
        }

        renderOk(result[0]);
      } catch (error) {
        console.error(error);
        renderError("Error de conexión", "No fue posible comunicarse con el servicio de validación.");
      }
    }

    validar();
  </script>
</body>
</html>
